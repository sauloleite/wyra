[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wyra"
dynamic = ["version"]
description = "Build fine-tuning datasets (JSONL) from your own data: deterministic converters first, local or cloud LLMs optional."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Saulo Leite", email = "sjoldeveloper@gmail.com" }]
keywords = ["fine-tuning", "jsonl", "dataset", "sft", "llm", "synthetic-data", "ollama"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
tokens = ["tiktoken>=0.7"]
openai = ["openai>=1.40"]
gemini = ["google-genai>=1.0"]
all = ["wyra[tokens,openai,gemini]"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.10",
  "tiktoken>=0.7",
  "openai>=1.40",
  "google-genai>=1.0",
]

[project.scripts]
wyra = "wyra.cli:main"

[project.urls]
Homepage = "https://github.com/sauloleite/wyra"
Issues = "https://github.com/sauloleite/wyra/issues"

[tool.hatch.version]
path = "wyra/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["wyra"]

[tool.hatch.build.targets.sdist]
include = ["wyra", "tests", "examples", "docs", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["wyra"]

[[tool.mypy.overrides]]
module = ["google.*", "tiktoken.*", "openai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: needs a running model server (skipped by default)",
  "extras: needs an optional dependency",
]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["wyra"]
